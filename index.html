<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>海外节点测速（波形图 MB/s + 峰值标注）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0; padding: 16px; min-height: 100vh;
  }
  h1 { font-size: 20px; margin-bottom: 16px; color: #38bdf8; text-align: center; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .toolbar select, .toolbar button {
    flex: 1; padding: 10px 12px; border-radius: 8px; font-size: 14px; cursor: pointer;
    background: #1e293b; color: #e2e8f0; border: 1px solid #334155; min-width: 100px;
  }
  .toolbar button { background: #0ea5e9; color: #fff; border: none; font-weight: 600; }
  .toolbar button:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }
  .node-list { display: flex; flex-direction: column; gap: 10px; }
  .node-card {
    background: #1e293b; border-radius: 10px; padding: 14px;
    border: 1px solid #334155; transition: border-color 0.2s;
  }
  .node-card.active { border-color: #38bdf8; }
  .node-card.done { border-color: #22c55e; }
  .node-card.fail { border-color: #ef4444; }
  .node-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
  .node-name { font-weight: 600; font-size: 15px; flex: 1; }
  .node-region { font-size: 12px; color: #94a3b8; background: #0f172a; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
  .test-btn {
    padding: 6px 12px; border-radius: 6px; border: none; background: #0ea5e9;
    color: #fff; font-size: 12px; cursor: pointer; font-weight: 600; white-space: nowrap;
  }
  .test-btn:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }
  .wave-wrap {
    background: #0f172a; border-radius: 8px; height: 72px; overflow: hidden;
    margin-bottom: 8px; position: relative;
  }
  .wave-canvas { width: 100%; height: 100%; display: block; }
  .wave-label {
    position: absolute; top: 2px; right: 6px; font-size: 10px; color: #475569;
    pointer-events: none;
  }
  .stats { display: flex; justify-content: space-between; font-size: 13px; color: #94a3b8; flex-wrap: wrap; gap: 6px; }
  .stats .speed { color: #38bdf8; font-weight: 700; font-size: 16px; }
  .stats .peak { color: #22c55e; font-weight: 600; }
  .stats .trough { color: #f59e0b; font-weight: 600; }
  .stats .status { font-size: 12px; }
  .result-summary {
    margin-top: 20px; padding: 14px; background: #1e293b; border-radius: 10px;
    border: 1px solid #334155; font-size: 13px; line-height: 1.8; display: none;
  }
  .result-summary.show { display: block; }
  .result-summary strong { color: #38bdf8; }
  .copy-btn { margin-top: 10px; width: 100%; padding: 10px; background: #334155; border: none; border-radius: 8px; color: #e2e8f0; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>

<h1>🌍 海外节点测速（MB/s · 峰值标注）</h1>

<div class="toolbar">
  <select id="regionFilter">
    <option value="all">全部地区</option>
    <option value="亚洲">亚洲</option>
    <option value="北美">北美</option>
    <option value="欧洲">欧洲</option>
    <option value="大洋洲">大洋洲</option>
  </select>
  <select id="fileSize">
    <option value="104857600">100 MB</option>
    <option value="1073741824">1 GB</option>
  </select>
</div>

<div class="toolbar">
  <button id="seqBtn" onclick="startSequential()">▶ 顺序挨个测试</button>
  <button id="stopBtn" onclick="stopAll()" disabled>■ 停止</button>
</div>

<div class="node-list" id="nodeList"></div>

<div class="result-summary" id="resultSummary"></div>

<script>
const NODES = [
  { name: "日本 东京", region: "亚洲", url: "https://hnd-jp-ping.vultr.com/vultr.com.{sizeMB}MB.bin" },
  { name: "日本 东京 (Datapacket)", region: "亚洲", url: "http://tyo.download.datapacket.com/{size}mb.bin" },
  { name: "新加坡", region: "亚洲", url: "https://sgp-ping.vultr.com/vultr.com.{sizeMB}MB.bin" },
  { name: "新加坡 (Datapacket)", region: "亚洲", url: "http://sgp.download.datapacket.com/{size}mb.bin" },
  { name: "韩国 首尔", region: "亚洲", url: "https://sel-kor-ping.vultr.com/vultr.com.{sizeMB}MB.bin" },
  { name: "中国香港 (Datapacket)", region: "亚洲", url: "http://hkg.download.datapacket.com/{size}mb.bin" },
  { name: "美国 洛杉矶", region: "北美", url: "https://lax-ca-us-ping.vultr.com/vultr.com.{sizeMB}MB.bin" },
  { name: "美国 洛杉矶 (Datapacket)", region: "北美", url: "http://lax.download.datapacket.com/{size}mb.bin" },
  { name: "美国 硅谷", region: "北美", url: "https://sjo-ca-us-ping.vultr.com/vultr.com.{sizeMB}MB.bin" },
  { name: "美国 西雅图", region: "北美", url: "https://wa-us-ping.vultr.com/vultr.com.{sizeMB}MB.bin" },
  { name: "美国 芝加哥", region: "北美", url: "https://il-us-ping.vultr.com/vultr.com.{sizeMB}MB.bin" },
  { name: "美国 达拉斯", region: "北美", url: "https://tx-us-ping.vultr.com/vultr.com.{sizeMB}MB.bin" },
  { name: "美国 迈阿密", region: "北美", url: "https://fl-us-ping.vultr.com/vultr.com.{sizeMB}MB.bin" },
  { name: "美国 亚特兰大", region: "北美", url: "https://ga-us-ping.vultr.com/vultr.com.{sizeMB}MB.bin" },
  { name: "美国 新泽西", region: "北美", url: "https://nj-us-ping.vultr.com/vultr.com.{sizeMB}MB.bin" },
  { name: "美国 阿什本 (Datapacket)", region: "北美", url: "http://ash.download.datapacket.com/{size}mb.bin" },
  { name: "加拿大多伦多", region: "北美", url: "https://tor-ca-ping.vultr.com/vultr.com.{sizeMB}MB.bin" },
  { name: "墨西哥 墨西哥城", region: "北美", url: "https://mex-mx-ping.vultr.com/vultr.com.{sizeMB}MB.bin" },
  { name: "巴西 圣保罗", region: "北美", url: "https://sao-br-ping.vultr.com/vultr.com.{sizeMB}MB.bin" },
  { name: "英国 伦敦", region: "欧洲", url: "https://lon-gb-ping.vultr.com/vultr.com.{sizeMB}MB.bin" },
  { name: "法国 巴黎", region: "欧洲", url: "https://par-fr-ping.vultr.com/vultr.com.{sizeMB}MB.bin" },
  { name: "法国 巴黎 (Datapacket)", region: "欧洲", url: "http://par.download.datapacket.com/{size}mb.bin" },
  { name: "德国 法兰克福", region: "欧洲", url: "https://fra-de-ping.vultr.com/vultr.com.{sizeMB}MB.bin" },
  { name: "荷兰 阿姆斯特丹", region: "欧洲", url: "https://ams-nl-ping.vultr.com/vultr.com.{sizeMB}MB.bin" },
  { name: "西班牙 马德里", region: "欧洲", url: "https://mad-es-ping.vultr.com/vultr.com.{sizeMB}MB.bin" },
  { name: "瑞典 斯德哥尔摩", region: "欧洲", url: "https://sto-se-ping.vultr.com/vultr.com.{sizeMB}MB.bin" },
  { name: "波兰 华沙", region: "欧洲", url: "https://waw-pl-ping.vultr.com/vultr.com.{sizeMB}MB.bin" },
  { name: "澳大利亚 悉尼", region: "大洋洲", url: "https://syd-au-ping.vultr.com/vultr.com.{sizeMB}MB.bin" },
];

const MAX_POINTS = 120;
let activeXhr = null;
let isBusy = false;
let stopFlag = false;
let results = [];

function renderNodes(filter = "all") {
  const list = document.getElementById("nodeList");
  list.innerHTML = "";
  const filtered = filter === "all" ? NODES : NODES.filter(n => n.region === filter);

  filtered.forEach((node, idx) => {
    const card = document.createElement("div");
    card.className = "node-card";
    card.id = `card-${idx}`;
    card.dataset.url = node.url;
    card.dataset.name = node.name;

    card.innerHTML = `
      <div class="node-header">
        <span class="node-name">${node.name}</span>
        <span class="node-region">${node.region}</span>
        <button class="test-btn" id="btn-${idx}">测这个</button>
      </div>
      <div class="wave-wrap">
        <canvas class="wave-canvas" id="canvas-${idx}"></canvas>
        <span class="wave-label">MB/s</span>
      </div>
      <div class="stats">
        <span>速度：<span class="speed" id="speed-${idx}">--</span> MB/s</span>
        <span class="peak">▲ <span id="peak-${idx}">--</span></span>
        <span class="trough">▼ <span id="trough-${idx}">--</span></span>
        <span class="status" id="status-${idx}">待测</span>
      </div>
    `;

    card.querySelector(`#btn-${idx}`).addEventListener("click", () => startSingle(card));
    list.appendChild(card);
  });

  refreshButtons();
}

function buildUrl(template, bytes) {
  const sizeMB = bytes / (1024 * 1024);
  return template.replace("{sizeMB}", sizeMB).replace("{size}", sizeMB);
}

// 绘制波形（单位 MB/s），带峰值/谷值箭头标注
function drawWave(canvas, points) {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  if (canvas.width !== rect.width * dpr || canvas.height !== rect.height * dpr) {
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
  }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const w = rect.width, h = rect.height;
  ctx.clearRect(0, 0, w, h);

  // 背景网格
  ctx.strokeStyle = "#1e293b";
  ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    const y = (h / 4) * i;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(w, y);
    ctx.stroke();
  }

  if (points.length < 2) return;

  const maxVal = Math.max(...points, 0.1);
  const stepX = w / (MAX_POINTS - 1);
  const offset = MAX_POINTS - points.length;

  // 映射函数：数值 → y 坐标
  const toY = (v) => h - (v / maxVal) * (h - 20) - 10;

  // 填充区域
  ctx.beginPath();
  ctx.moveTo(offset * stepX, h);
  points.forEach((v, i) => {
    ctx.lineTo((offset + i) * stepX, toY(v));
  });
  ctx.lineTo(w, h);
  ctx.closePath();
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, "rgba(56,189,248,0.35)");
  grad.addColorStop(1, "rgba(56,189,248,0.02)");
  ctx.fillStyle = grad;
  ctx.fill();

  // 折线
  ctx.beginPath();
  points.forEach((v, i) => {
    const x = (offset + i) * stepX;
    const y = toY(v);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = "#38bdf8";
  ctx.lineWidth = 2;
  ctx.lineJoin = "round";
  ctx.stroke();

  // 找最大值、最小值索引
  let maxIdx = 0, minIdx = 0;
  for (let i = 1; i < points.length; i++) {
    if (points[i] > points[maxIdx]) maxIdx = i;
    if (points[i] < points[minIdx]) minIdx = i;
  }

  const drawMarker = (idx, color, arrow, label, value) => {
    const x = (offset + idx) * stepX;
    const y = toY(points[idx]);
    // 箭头符号
    ctx.fillStyle = color;
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(arrow, x, arrow === "▲" ? y - 6 : y + 14);
    // 数值标签
    ctx.font = "bold 10px sans-serif";
    ctx.fillText(value, x, arrow === "▲" ? y - 18 : y + 26);
    // 标记点
    ctx.beginPath();
    ctx.arc(x, y, 2.5, 0, Math.PI * 2);
    ctx.fill();
  };

  drawMarker(maxIdx, "#22c55e", "▲", "", points[maxIdx].toFixed(2));
  drawMarker(minIdx, "#f59e0b", "▼", "", points[minIdx].toFixed(2));

  // 最新点圆点
  const lastV = points[points.length - 1];
  const lx = w;
  const ly = toY(lastV);
  ctx.beginPath();
  ctx.arc(lx - 2, ly, 3, 0, Math.PI * 2);
  ctx.fillStyle = "#38bdf8";
  ctx.fill();
}

// 核心测速（速度单位：MB/s）
function testOne(card, bytes) {
  return new Promise((resolve) => {
    const url = buildUrl(card.dataset.url, bytes);
    const idx = card.id.replace("card-", "");
    const canvas = document.getElementById(`canvas-${idx}`);
    const speedEl = document.getElementById(`speed-${idx}`);
    const peakEl = document.getElementById(`peak-${idx}`);
    const troughEl = document.getElementById(`trough-${idx}`);
    const statusEl = document.getElementById(`status-${idx}`);

    card.classList.remove("done", "fail");
    card.classList.add("active");
    statusEl.textContent = "连接中...";
    speedEl.textContent = "--";
    peakEl.textContent = "--";
    troughEl.textContent = "--";

    const wavePoints = [];
    drawWave(canvas, wavePoints);

    const xhr = new XMLHttpRequest();
    activeXhr = xhr;
    xhr.open("GET", url, true);
    xhr.responseType = "blob";

    let startTime = null, lastLoaded = 0, lastTime = null, samples = [];
    let peak = 0, trough = Infinity;

    xhr.onprogress = (e) => {
      if (!startTime) { startTime = performance.now(); lastTime = startTime; lastLoaded = 0; }
      const now = performance.now();
      const loaded = e.loaded;
      const timeDiff = (now - lastTime) / 1000;

      if (timeDiff > 0.15) {
        const byteDiff = loaded - lastLoaded;
        const inst = byteDiff / timeDiff / 1e6; // MB/s
        samples.push(inst);
        if (samples.length > 5) samples.shift();
        const avg = samples.reduce((a, b) => a + b, 0) / samples.length;
        speedEl.textContent = avg.toFixed(2);

        // 峰值 / 谷值
        if (inst > peak) peak = inst;
        if (inst < trough) trough = inst;
        peakEl.textContent = peak.toFixed(2) + " MB/s";
        troughEl.textContent = trough.toFixed(2) + " MB/s";

        wavePoints.push(inst);
        if (wavePoints.length > MAX_POINTS) wavePoints.shift();
        drawWave(canvas, wavePoints);

        lastTime = now;
        lastLoaded = loaded;
      }
      statusEl.textContent = `${(loaded / 1024 / 1024).toFixed(1)} MB`;
    };

    xhr.onload = () => {
      const elapsed = (performance.now() - startTime) / 1000;
      const finalSpeed = (xhr.response.size || bytes) / elapsed / 1e6;
      speedEl.textContent = finalSpeed.toFixed(2);
      statusEl.textContent = "完成";
      card.classList.remove("active");
      card.classList.add("done");
      activeXhr = null;
      resolve(finalSpeed);
    };

    xhr.onerror = () => {
      statusEl.textContent = "失败";
      card.classList.remove("active");
      card.classList.add("fail");
      activeXhr = null;
      resolve(null);
    };

    xhr.onabort = () => {
      statusEl.textContent = "已停止";
      card.classList.remove("active");
      activeXhr = null;
      resolve(null);
    };

    xhr.send();
  });
}

function addResult(name, speed) {
  results = results.filter(r => r.name !== name);
  results.push({ name, speed, time: new Date().toLocaleTimeString() });
  showSummary();
}

function showSummary() {
  if (results.length === 0) {
    document.getElementById("resultSummary").classList.remove("show");
    return;
  }
  const summary = document.getElementById("resultSummary");
  summary.classList.add("show");
  const sorted = [...results].sort((a, b) => b.speed - a.speed);
  let html = "<strong>📊 测速结果（按速度排序，单位 MB/s）</strong><br>";
  sorted.forEach((r, i) => {
    html += `${i + 1}. ${r.name} — <strong>${r.speed.toFixed(2)} MB/s</strong> <span style="color:#64748b;font-size:11px;">(${r.time})</span><br>`;
  });
  html += `<button class="copy-btn" onclick="copyResults()">📋 复制结果</button>`;
  summary.innerHTML = html;
}

async function startSequential() {
  if (isBusy) return;
  isBusy = true; stopFlag = false; results = [];
  refreshButtons();
  const filter = document.getElementById("regionFilter").value;
  const bytes = parseInt(document.getElementById("fileSize").value);
  renderNodes(filter);
  const cards = [...document.querySelectorAll(".node-card")];
  for (const card of cards) {
    if (stopFlag) break;
    const speed = await testOne(card, bytes);
    if (speed !== null) addResult(card.dataset.name, speed);
  }
  isBusy = false; stopFlag = false;
  refreshButtons();
}

async function startSingle(card) {
  if (isBusy) return;
  isBusy = true; stopFlag = false;
  refreshButtons();
  const bytes = parseInt(document.getElementById("fileSize").value);
  const speed = await testOne(card, bytes);
  if (speed !== null) addResult(card.dataset.name, speed);
  isBusy = false;
  refreshButtons();
}

function stopAll() {
  stopFlag = true;
  if (activeXhr) { activeXhr.abort(); activeXhr = null; }
}

function refreshButtons() {
  document.getElementById("seqBtn").disabled = isBusy;
  document.getElementById("stopBtn").disabled = !isBusy;
  document.querySelectorAll(".test-btn").forEach(btn => { btn.disabled = isBusy; });
}

function copyResults() {
  let text = "海外节点测速结果（MB/s）\n";
  const sorted = [...results].sort((a, b) => b.speed - a.speed);
  sorted.forEach((r, i) => {
    text += `${i + 1}. ${r.name}: ${r.speed.toFixed(2)} MB/s (${r.time})\n`;
  });
  navigator.clipboard.writeText(text).then(() => alert("已复制")).catch(() => alert("复制失败"));
}

document.getElementById("regionFilter").addEventListener("change", (e) => {
  if (!isBusy) renderNodes(e.target.value);
});

renderNodes();
</script>
</body>
</html>
